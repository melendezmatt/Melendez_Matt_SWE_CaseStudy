[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamentals-tracker"
version = "0.1.0"
description = "SEC fundamentals, 10-K text and market prices, with a Q&A agent on top"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yfinance>=0.2.50",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracker = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live evaluation (tests/test_live.py) calls a real LLM, so it only runs on request: pytest -m live
addopts = "-rs -m 'not live'"
markers = ["live: asks the configured real LLM the brief's questions (needs LLM_API_KEY and Postgres)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true  # yfinance and bs4 ship without type hints
